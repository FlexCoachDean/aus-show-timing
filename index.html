<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Day Timing — Flex Success</title>
<meta name="description" content="Show-day stage timing for bodybuilding competitions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9201;</text></svg>">

<body>
<div id="app-root"></div>
<style>
:root{
  --bg:#EEF0F2;
  --card:#FFFFFF;
  --ink:#171B1E;
  --muted:#6C757D;
  --line:#DFE3E6;
  --burg:#8A1E2D;
  --burg-soft:#F6E7E9;
  --gold:#B9882F;
  --gold-soft:#F7EFDC;
  --call:#2E6B5A;
  --call-soft:#E4F0EB;
  --trav:#3D5A80;
  --trav-soft:#E7EDF5;
  --done:#9AA0A6;
  --warn:#C75B12;
  --warn-soft:#F7E9DD;
  --rad:12px;
  --shadow:0 1px 2px rgba(23,27,30,.06), 0 6px 18px rgba(23,27,30,.05);
  --disp:"Helvetica Neue Condensed","Arial Narrow",-apple-system,"Segoe UI",Roboto,sans-serif;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:inherit;}
#app-root{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);}

.masthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px;}
.masthead h1{font-size:21px;font-weight:800;margin:0 0 6px;}
.masthead h1 input{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;color:var(--burg);}
.masthead .sub{font-size:12px;color:var(--muted);}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.meta-field{display:flex;flex-direction:column;gap:3px;}
.meta-field label{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);opacity:.75;}
.meta-field input{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:13px;min-width:0;}
.meta-field input[type=text]{width:240px;}
.meta-field input:focus{outline:none;border-color:var(--ink);}
.save-pill{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.save-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--call);}

.upload-zone{border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:22px;display:flex;align-items:center;gap:16px;background:var(--card);margin-bottom:22px;transition:border-color .15s,background .15s;}
.upload-zone.drag{border-color:var(--burg);background:var(--burg-soft);}
.upload-zone .icon{width:38px;height:38px;flex:0 0 auto;color:var(--muted);}
.upload-zone .copy{flex:1;min-width:200px;}
.upload-zone .copy strong{display:block;font-size:14px;font-weight:700;margin-bottom:2px;}
.upload-zone .copy span{font-size:12px;color:var(--muted);}
.upload-zone input[type=file]{display:none;}

.btn{font-weight:600;font-size:12.5px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:filter .12s,background .12s,border-color .12s,color .12s;}
.btn:hover{filter:brightness(1.15);}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.ghost:hover{border-color:var(--muted);filter:none;}
.btn.small{padding:5px 9px;font-size:11px;}
.btn.danger{background:transparent;color:var(--burg);border-color:var(--burg);}
.btn.danger:hover{background:var(--burg-soft);filter:none;}
.btn.armed,.icon-btn.armed{background:var(--burg);color:#fff;border-color:var(--burg);}
.btn.add{background:transparent;color:var(--call);border-color:var(--call);}
.btn.add:hover{background:var(--call-soft);filter:none;}
.btn.learn{background:transparent;color:var(--gold);border-color:var(--gold);}
.btn.learn:hover{background:var(--gold-soft);filter:none;}

.cal-badge{display:inline-block;color:var(--gold);font-size:8px;margin-left:5px;cursor:help;}

.notify-cell{min-width:170px;max-width:220px;}
.notify-chip{display:block;font-family:var(--disp);font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:3px 6px;margin-bottom:3px;white-space:normal;line-height:1.4;cursor:help;}
.notify-chip:last-child{margin-bottom:0;}
.notify-chip.pump{background:var(--gold-soft);color:var(--gold);}
.notify-chip.next{background:var(--trav-soft);color:var(--trav);}
.notify-chip.warn{background:var(--burg-soft);color:var(--burg);}

.history-panel{margin-bottom:18px;padding:16px 18px;}
.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.history-title{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);}
.history-empty{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:640px;}
.history-note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;}
table.history-table{width:100%;border-collapse:collapse;font-size:12.5px;}
table.history-table th{text-align:left;font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line);}
table.history-table td{padding:6px 8px;border-bottom:1px solid var(--line);}
table.history-table tr:last-child td{border-bottom:none;}
.btn:disabled{opacity:.4;cursor:default;}

.parse-status{font-size:12px;color:var(--muted);margin:-10px 0 20px;padding:0 2px;}
.parse-status.err{color:var(--burg);}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.toolbar .left{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);}
.summary-strip{display:flex;gap:26px;background:var(--ink);border-radius:10px;padding:12px 18px;}
.summary-strip > div{display:flex;flex-direction:column;gap:2px;}
.summary-strip > div > div:first-child{font-family:var(--disp);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#fff;opacity:.55;}
.summary-strip b{color:#fff;font-size:15px;font-weight:700;}

table.sheet{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);overflow:hidden;}
table.sheet thead th{position:sticky;top:0;background:var(--card);text-align:left;font-family:var(--disp);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);font-weight:400;padding:12px 14px;border-bottom:1px solid var(--line);}
table.sheet td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
.group-row td{padding-top:22px;padding-bottom:8px;border-bottom:none;}
.group-row .glabel{display:flex;align-items:center;gap:10px;}
.group-row .bar{width:4px;align-self:stretch;min-height:16px;border-radius:2px;}
.group-row .glabel input{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);}
.group-row .gcount{font-weight:400;font-size:11px;color:var(--muted);}

tr.cat-row{background:var(--card);}
tr.cat-row:hover{background:var(--bg);}
tr.cat-row.has-client{background:var(--burg-soft);}
tr.cat-row.has-client:hover{background:#f1d9dc;}
tr.overall-row{background:var(--bg);}
tr.overall-row td{font-style:normal;color:var(--muted);}
tr.custom-row{background:var(--trav-soft);}
tr.delay-row{background:var(--warn-soft);}
tr.delay-row td{border-bottom:1px solid var(--line);}
.delay-icon{color:var(--warn);margin-right:7px;font-size:12px;}
.delay-note{color:var(--warn)!important;font-weight:600;font-size:12.5px;}
.delay-note::placeholder{color:var(--warn);opacity:.55;font-weight:400;}
.icon-btn.delay-add:hover{background:var(--warn-soft);color:var(--warn);}
.transfer-box{width:100%;height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);color:var(--ink);resize:vertical;}
.transfer-box:focus{outline:none;border-color:var(--ink);}
.transfer-msg{font-size:11.5px;color:var(--muted);}
.sync-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
.btn.push{background:var(--call);color:#fff;border-color:var(--call);}
.btn.push:hover{filter:brightness(1.1);}
.btn.push:disabled{opacity:.5;}
.readonly-tag{display:inline-flex;align-items:center;font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--trav-soft);color:var(--trav);border-radius:6px;padding:5px 9px;cursor:help;}
.key-input{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 9px;font-size:13px;width:220px;}
.key-input:focus{outline:none;border-color:var(--ink);}

.cell-edit{background:transparent;border:1px solid transparent;color:var(--ink);font-family:inherit;font-size:13px;border-radius:6px;padding:4px 5px;width:100%;}
.cell-edit:hover{border-color:var(--line);}
.cell-edit:focus{outline:none;border-color:var(--ink);background:var(--card);}
.classname{font-weight:700;}
.extra-tag{display:inline-block;font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--gold-soft);color:var(--gold);border-radius:5px;padding:2px 6px;margin-left:7px;vertical-align:middle;}
.client-tag{display:inline-block;font-family:var(--disp);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--burg);color:#fff;border-radius:5px;padding:2px 6px;margin-left:7px;vertical-align:middle;}

.mono{font-variant-numeric:tabular-nums;}
.num-cell{text-align:right;}
.num-input{width:54px;text-align:right;}
.formula-select{background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:11px;border-radius:6px;padding:4px 5px;}
.duration-cell{color:var(--muted);}
.time-cell{font-weight:700;}
.time-cell.est{color:var(--muted);font-weight:400;}
.actual-input{background:transparent;border:1px solid var(--line);color:var(--muted);opacity:.7;font-size:12.5px;font-weight:600;border-radius:7px;padding:4px 6px;width:92px;transition:opacity .12s,border-color .12s,background .12s,color .12s;}
.actual-input:hover{opacity:1;}
.actual-input.overridden{opacity:1;color:var(--burg);border-color:var(--burg);background:var(--burg-soft);}
.actual-input.input-error{border-color:var(--burg);color:var(--burg);background:var(--burg-soft);opacity:1;}
.actual-input:focus{outline:none;opacity:1;border-color:var(--ink);}
.clear-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0 3px;}
.clear-x:hover{color:var(--burg);}
.row-actions{display:flex;gap:3px;opacity:0;transition:opacity .1s;}
tr:hover .row-actions{opacity:1;}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:3px;border-radius:5px;font-size:11px;line-height:1;}
.icon-btn:hover{background:var(--line);color:var(--ink);}
.icon-btn.del:hover{background:var(--burg-soft);color:var(--burg);}

.athlete-toggle{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;margin-right:5px;width:14px;}
.athlete-panel{background:var(--bg);}
.athlete-panel td{padding:12px 14px 16px 32px;border-bottom:1px solid var(--line);}
.athlete-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:6px 14px;}
.athlete-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:2px 4px;border-radius:6px;}
.athlete-item.is-client{background:var(--burg-soft);}
.athlete-item.scratched{opacity:.55;}
.athlete-item.scratched .cname{text-decoration:line-through;color:var(--done);font-weight:400;}
.athlete-check{display:inline-flex;align-items:center;gap:3px;cursor:pointer;}
.athlete-item input{accent-color:var(--gold);}
.athlete-item .client-check input{accent-color:var(--burg);}
.athlete-item .cname{color:var(--ink);flex:1;}
.athlete-item .ccomp{color:var(--muted);font-size:11px;}
.athlete-item.routine .cname{color:var(--gold);font-weight:600;}
.athlete-item.is-client .cname{color:var(--burg);font-weight:700;}
.client-check{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
.athlete-item.is-client .client-check{color:var(--burg);}
.scratch-btn{background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 6px;white-space:nowrap;}
.scratch-btn:hover{border-color:var(--burg);color:var(--burg);background:var(--burg-soft);}
.athlete-item.scratched .scratch-btn{border-color:var(--call);color:var(--call);}
.athlete-item.scratched .scratch-btn:hover{background:var(--call-soft);}
.comp-cell{cursor:pointer;}
.comp-cell:hover{text-decoration:underline;text-decoration-style:dotted;}
.scratch-note{display:block;font-size:9.5px;color:var(--muted);font-weight:400;}
.routine-legend{font-size:11px;color:var(--muted);margin-bottom:10px;}
.routine-legend .formula-select{margin-left:4px;}

.tab-bar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.tab{font-family:var(--disp);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,color .12s,border-color .12s;}
.tab:hover{border-color:var(--muted);color:var(--ink);}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tab-count{font-family:inherit;font-size:10px;opacity:.6;font-weight:400;}
.tab-hint{font-size:11px;color:var(--muted);margin-left:6px;}
.add-row-strip{display:flex;gap:8px;padding:14px 2px 30px;}
.footer-note{font-size:11px;color:var(--muted);margin-top:26px;line-height:1.6;}

@media print{
  .upload-zone,.toolbar .right,.add-row-strip,.row-actions,.athlete-toggle,.save-pill{display:none!important;}
  body{background:#fff;color:#000;}
  #app-root{max-width:none;}
  .summary-strip{background:#fff;border:1px solid #000;}
  .summary-strip > div > div:first-child, .summary-strip b{color:#000;}
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
(function(){

/* ---------- constants ---------- */

var GROUP_COLORS = {};
var PALETTE = ['#3D5A80','#B9882F','#8A1E2D','#C75B12','#2E6B5A'];
var paletteIdx = 0;
function colorFor(discipline){
  var key = discipline.toLowerCase();
  if(!GROUP_COLORS[key]){
    GROUP_COLORS[key] = PALETTE[paletteIdx % PALETTE.length];
    paletteIdx++;
  }
  return GROUP_COLORS[key];
}
// seed known disciplines with fixed colors so re-parses stay stable
colorFor("men's physique");
colorFor("men's classic physique");
colorFor("men's bodybuilding");

var TEMPLATE = {
  "men's physique": ['masters','true novice','novice a','novice b','open a','open b'],
  "men's classic physique": ['junior','masters','true novice a','true novice b','true novice c','novice a','novice b','novice c','open a','open b','open c'],
  "men's bodybuilding": ['junior','masters 40+','masters 50+','true novice','novice','lightweight','middleweight','light heavy','heavyweight','supers'],
  "women's bikini": ['junior','masters 35+','masters 40+','true novice','true novice a','true novice b','true novice c','novice','novice a','novice b','novice c','open','open a','open b','open c'],
  "women's figure": ['junior','masters 35+','masters 40+','true novice','novice','open'],
  "women's fit model": ['junior','masters 35+','masters 40+','true novice','novice','open'],
  "women's wellness": ['junior','masters 35+','true novice','novice','open'],
  "women's physique": ['masters 40+','true novice','novice','open'],
  "women's bodybuilding": ['masters 40+','true novice','novice','open']
};

function normClass(discipline, className){
  var d = discipline.toLowerCase().trim();
  var c = className.toLowerCase().trim();
  if(d === "men's physique"){
    if(/^masters/.test(c)) c = 'masters';
  }
  if(d === "men's bodybuilding"){
    c = c.replace(/^open\s+/, '');
    c = c.replace('light heavyweight','light heavy');
    c = c.replace('super heavyweight','supers');
  }
  if(d === "men's classic physique"){
    c = c.replace(/^open class\s+/, 'open ');
  }
  if(d.indexOf('women') > -1){
    c = c.replace(/^open class\s+/, 'open ');
  }
  return c;
}
function isExtraCategory(discipline, className){
  var d = discipline.toLowerCase().trim();
  if(!TEMPLATE[d]) return true;
  return TEMPLATE[d].indexOf(normClass(discipline, className)) === -1;
}
/* Which timing formula each division uses.
     physique = (competitors x 0.5) + (routines x 1) + 2
     bb       = (competitors x 1)   + (routines x 1) + 2
     hybrid   = (competitors x 0.75)+ (routines x 1) + 2   <- average of the two
*/
function defaultFormula(discipline){
  var d = discipline.toLowerCase().trim();

  // men's
  if(d === "men's physique") return 'physique';
  if(d === "men's classic physique") return 'bb';
  if(d === "men's bodybuilding") return 'bb';

  // women's — bikini and figure run like men's physique
  if(d.indexOf('bikini') > -1) return 'physique';
  if(d.indexOf('figure') > -1) return 'physique';

  // women's — bodybuilding and wellness run like men's bodybuilding
  if(d.indexOf('wellness') > -1) return 'bb';
  if(d.indexOf("women's bodybuilding") > -1) return 'bb';

  // anything else (women's physique, fit model, new divisions) averages the two
  if(d.indexOf('women') > -1) return 'hybrid';

  // unknown men's-side divisions keep the old fallbacks
  if(d.indexOf('bodybuilding') > -1) return 'bb';
  if(d.indexOf('physique') > -1) return 'bb';
  return 'physique';
}

function genderOf(discipline){
  return /^\s*women/i.test(discipline || '') ? 'womens' : 'mens';
}

/* ---------- state ---------- */

var state = {
  eventName: 'Show Day Timing',
  showDate: '',
  startTime: '09:00',
  rows: [],
  fileName: '',
  clients: {},
  alertLeadMinutes: 45
};
var uid = 0;
function nextId(){ uid++; return 'r' + uid + '_' + Date.now().toString(36); }
var historyPanelOpen = false;
var transferPanelOpen = false;
var activeTab = 'all';  // 'all' | 'mens' | 'womens' — filters the view only, never the timing
var learnMsg = null;
var learnMsgTimer = null;

/* ---------- storage ---------- */

/* Storage layer.
   Uses localStorage, which on a real domain persists per-browser indefinitely
   and — crucially — survives redeploys, because the origin never changes.
   If TEAM_SYNC_URL is set, data is also pushed/pulled from the shared team
   pool so every coach learns from every show. */

var TEAM_SYNC_URL = window.TEAM_SYNC_URL || null;

/* Who can contribute to the shared pool.
   Everyone reads. Only a browser holding the contributor key can write, so
   coaches receive your learning without being able to alter it. The key is
   stored per-browser; set it once via the Share/backup panel. */
function contributorKey(){ return LS.get('contributor_key') || ''; }
function isContributor(){ return !!contributorKey(); }

var LS = {
  get: function(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  set: function(key, val){
    try{ localStorage.setItem(key, val); return true; }catch(e){ return false; }
  }
};

var saveTimer = null;
function scheduleSave(){
  setSaveStatus('saving');
  // Write synchronously right away so nothing is ever lost to a closed tab,
  // then report status. The old debounce is what silently dropped records.
  var ok = LS.set('current_show', JSON.stringify(state));
  setSaveStatus(ok ? 'saved' : 'error');
}
function setSaveStatus(s){
  var el = document.getElementById('save-pill');
  if(!el) return;
  var label = s === 'saving' ? 'Saving…' : s === 'error' ? 'Not saved (storage unavailable)' : 'All changes saved';
  var dotColor = s === 'error' ? 'var(--burg)' : s === 'saving' ? 'var(--gold)' : 'var(--call)';
  el.innerHTML = '<span class="dot" style="background:' + dotColor + '"></span>' + label;
}
function loadSaved(){
  try{
    Promise.resolve({value: LS.get('current_show')}).then(function(r){
      if(r && r.value){
        try{
          var parsed = JSON.parse(r.value);
          if(parsed && parsed.rows && parsed.rows.length){
            state = parsed;
            if(!state.clients) state.clients = {};
            if(state.alertLeadMinutes == null) state.alertLeadMinutes = 45;

          }
        }catch(e){}
      }
      render();
    }).catch(function(){ render(); });
  }catch(e){ render(); }
}

/* ---------- time helpers ---------- */

function baseDate(){ return new Date(2000,0,1); }
function timeStrToDate(hhmm){
  var d = baseDate();
  if(!hhmm) return d;
  var parts = hhmm.split(':');
  d.setHours(parseInt(parts[0],10)||0, parseInt(parts[1],10)||0, 0, 0);
  return d;
}
function dateToTimeStr(d){
  var h = d.getHours(), m = d.getMinutes();
  var hh = String(h).padStart(2,'0'), mm = String(m).padStart(2,'0');
  return hh + ':' + mm;
}
function formatClock(d){
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12; if(h12 === 0) h12 = 12;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + ampm;
}
function formatDuration(mins){
  var totalSec = Math.round(mins * 60);
  var mm = Math.floor(totalSec / 60), ss = totalSec % 60;
  return mm + ':' + String(ss).padStart(2,'0');
}

/* ---------- computation ---------- */

function rawFormulaMinutes(row){
  if(row.type === 'delay') return (row.delayMinutes != null ? row.delayMinutes : 0);
  if(row.type === 'overall') return (row.overallMinutes != null ? row.overallMinutes : 5);
  if(row.formulaType === 'manual') return (row.manualMinutes != null ? row.manualMinutes : 0);
  var c = row.competitors || 0;
  var r = row.routines || 0;
  if(row.formulaType === 'bb') return (c * 1) + (r * 1) + 2;
  if(row.formulaType === 'hybrid') return (c * 0.75) + (r * 1) + 2;
  return (c * 0.5) + (r * 1) + 2;
}

/* ---------- calibration engine ----------
   Learns from the gap between the formula estimate and what you actually enter
   as an Actual End time. Runs entirely in your browser — nothing is sent anywhere. */

var calibration = { records: [] };
var calSaveTimer = null;
function calKeyFor(row){
  return (row.discipline||'').toLowerCase().trim() + '|' + (row.className||'').toLowerCase().trim() + '|' + (row.formulaType||'physique');
}
function calBucketFor(row){
  return 'bucket|' + (row.formulaType||'physique');
}
function ratioFromRecords(recs){
  if(!recs.length) return null;
  var ratios = recs.map(function(r){
    if(!r.estMinutes || r.estMinutes <= 0) return 1;
    var ratio = r.actualMinutes / r.estMinutes;
    return Math.max(0.3, Math.min(3, ratio)); // clip outliers so one fat-fingered entry can't skew things
  });
  var sum = ratios.reduce(function(a,b){ return a+b; }, 0);
  return sum / ratios.length;
}
function calibratedMinutes(row){
  var raw = rawFormulaMinutes(row);
  row._rawMinutes = raw;
  row._calSource = null;
  if(row.type === 'overall' || row.type === 'delay' || row.formulaType === 'manual') return raw;
  var key = calKeyFor(row);
  var exact = calibration.records.filter(function(r){ return r.key === key; });
  var ratio = null, sampleN = 0, sourceLabel = null;
  if(exact.length >= 2){
    ratio = ratioFromRecords(exact); sampleN = exact.length; sourceLabel = 'this class';
  } else {
    var bucket = calBucketFor(row);
    var bucketRecs = calibration.records.filter(function(r){ return r.bucket === bucket; });
    if(bucketRecs.length >= 3){
      ratio = ratioFromRecords(bucketRecs); sampleN = bucketRecs.length; sourceLabel = row.formulaType === 'bb' ? 'comparison classes' : 'physique classes';
    }
  }
  if(ratio == null) return raw;
  var calibrated = Math.max(1, raw * ratio);
  row._calSource = { n: sampleN, label: sourceLabel, ratio: ratio };
  return calibrated;
}
function scheduleCalSave(){
  setSaveStatus('saving');
  calibration.records = calibration.records.slice(-5000);
  // Synchronous write — learning data is too valuable to risk on a debounce.
  var ok = LS.set('timing_calibration', JSON.stringify(calibration));
  setSaveStatus(ok ? 'saved' : 'error');
  if(ok && TEAM_SYNC_URL) pushToTeam();
}

/* ---------- optional shared team pool ---------- */
function pushToTeam(){
  if(!TEAM_SYNC_URL) return;
  if(!isContributor()) return; // read-only coach: never writes to the pool
  fetch(TEAM_SYNC_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Contributor-Key':contributorKey()},
    body: JSON.stringify({ records: calibration.records })
  }).catch(function(){ /* offline at a venue is normal; local copy still holds */ });
}
/* Explicit end-of-show push. Unlike the automatic background push this
   reports success or failure, and sends the whole history rather than only
   what just changed — so it also works to seed the pool the first time. */
function pushAllToTeam(){
  if(!TEAM_SYNC_URL) return Promise.resolve({ok:false, error:'sharing not configured'});
  if(!isContributor()) return Promise.resolve({ok:false, error:'no contributor key on this browser'});
  return fetch(TEAM_SYNC_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-Contributor-Key':contributorKey()},
    body: JSON.stringify({ records: calibration.records })
  }).then(function(r){
    return r.json().then(function(data){
      if(!r.ok) return {ok:false, error:(data && data.error) || ('HTTP ' + r.status)};
      return {ok:true, added:data.added};
    });
  }).catch(function(e){
    return {ok:false, error:'no connection'};
  });
}

function pullFromTeam(){
  if(!TEAM_SYNC_URL) return Promise.resolve();
  return fetch(TEAM_SYNC_URL).then(function(r){ return r.json(); }).then(function(data){
    if(!data || !data.records) return;

    if(!isContributor()){
      // Read-only coach: mirror the pool exactly. Merging would let a stray
      // local record drift their estimates away from the head coach's, and the
      // whole point is that everyone sees the same predicted times.
      // An empty pool is ignored rather than wiping a working local copy.
      if(!data.records.length) return;
      calibration.records = data.records.slice();
      LS.set('timing_calibration', JSON.stringify(calibration));
      return;
    }

    // Contributor: merge, since local records are the source of truth here.
    var seen = {};
    calibration.records.forEach(function(r){ seen[r.key+'|'+r.ts+'|'+r.actualMinutes] = true; });
    var added = 0;
    data.records.forEach(function(r){
      var sig = r.key+'|'+r.ts+'|'+r.actualMinutes;
      if(seen[sig]) return;
      seen[sig] = true; calibration.records.push(r); added++;
    });
    if(added) LS.set('timing_calibration', JSON.stringify(calibration));
  }).catch(function(){});
}
function loadCalibration(){
  return new Promise(function(resolve){
    try{
      var raw = LS.get('timing_calibration');
      if(raw){
        try{ var p = JSON.parse(raw); if(p && p.records) calibration = p; }catch(e){}
      }
      if(TEAM_SYNC_URL){ pullFromTeam().then(resolve); return; }
      resolve();
    }catch(e){ resolve(); }
  });
}
function commitActualsToHistory(force){
  recalcAll();
  var count = 0;
  state.rows.forEach(function(row){
    if(row.type === 'overall' || row.type === 'delay' || row.formulaType === 'manual') return;
    if(!row.actualEnd) return;
    if(!force && row.actualEnd === row._loggedActualEnd) return;
    var actualMinutes = (row.effEndD.getTime() - row.startD.getTime()) / 60000;
    if(actualMinutes <= 0) return;
    calibration.records.push({
      key: calKeyFor(row), bucket: calBucketFor(row),
      discipline: row.discipline, className: row.className, formulaType: row.formulaType,
      competitors: row.competitors, routines: row.routines,
      estMinutes: row._rawMinutes, actualMinutes: actualMinutes, ts: Date.now()
    });
    row._loggedActualEnd = row.actualEnd;
    count++;
  });
  if(count > 0){ scheduleCalSave(); scheduleSave(); }
  return count;
}
function clearCalibration(){
  calibration = { records: [] };
  state.rows.forEach(function(row){ row._loggedActualEnd = null; });
  scheduleCalSave(); scheduleSave();
}

function recalcAll(){
  var cursor = timeStrToDate(state.startTime);
  state.rows.forEach(function(row){
    if(row.type === 'category'){
      var active = row.athletes.filter(function(a){ return !a.scratched; });
      row.competitors = active.length;
      row.routines = active.filter(function(a){ return a.routine; }).length;
      row.scratchedCount = row.athletes.length - active.length;
    }
    row.minutes = calibratedMinutes(row);
    row.startD = new Date(cursor);
    row.estEndD = new Date(cursor.getTime() + row.minutes * 60000);
    if(row.actualEnd){
      var ad = timeStrToDate(row.actualEnd);
      // keep on same "day" chain as cursor's date component
      ad.setFullYear(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
      row.effEndD = ad;
    } else {
      row.effEndD = row.estEndD;
    }
    cursor = new Date(row.effEndD);
  });
  computeClientNotifications();
}

/* ---------- clients & backstage notifications ----------
   Marking a competitor as "my client" is global by comp #, so it follows them
   into every division they're entered in — that's what lets us spot when
   they're due back on stage later in the show. */

function isClient(comp){ return !!state.clients[comp]; }
function toggleClient(comp){
  if(state.clients[comp]) delete state.clients[comp];
  else state.clients[comp] = true;
  scheduleSave();
}

function computeClientNotifications(){
  var compRows = {};
  state.rows.forEach(function(row){
    if(row.type !== 'category') return;
    row.athletes.forEach(function(a){
      if(a.scratched || !isClient(a.comp)) return;
      if(!compRows[a.comp]) compRows[a.comp] = [];
      compRows[a.comp].push(row);
    });
  });

  var lead = state.alertLeadMinutes != null ? state.alertLeadMinutes : 45;

  state.rows.forEach(function(row){
    row.notifications = [];
    row.hasClient = false;
    if(row.type !== 'category') return;
    var clientAthletes = row.athletes.filter(function(a){ return !a.scratched && isClient(a.comp); });
    if(!clientAthletes.length) return;
    row.hasClient = true;

    var pumpTime = new Date(row.startD.getTime() - lead * 60000);
    var pumpNames = clientAthletes.map(function(a){ return a.name; }).join(', ');
    row.notifications.push({
      type: 'pump',
      text: 'Pump up drink',
      time: formatClock(pumpTime),
      name: pumpNames,
      title: lead + ' min before ' + row.className + ' starts — for ' + pumpNames
    });

    clientAthletes.forEach(function(a){
      var occ = compRows[a.comp] || [];
      var idx = occ.indexOf(row);
      var nextRow = occ[idx + 1];
      if(nextRow){
        var gapMin = (nextRow.startD.getTime() - row.effEndD.getTime()) / 60000;
        row.notifications.push({
          type: gapMin < 0 ? 'warn' : 'next',
          text: 'Next on stage',
          time: (gapMin < 0 ? 'now — ' : 'in ') + Math.round(Math.abs(gapMin)) + ' min',
          name: a.name,
          title: a.name + ' is next due on stage for ' + nextRow.className + ' (' + nextRow.discipline + ') at ' + formatClock(nextRow.startD)
        });
      }
    });
  });
}

/* ---------- PDF parsing ---------- */

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function extractLines(pdf){
  return pdf.getPage(1).then(function(){
    var pagePromises = [];
    for(var p = 1; p <= pdf.numPages; p++){
      pagePromises.push(pdf.getPage(p).then(function(page){
        return page.getTextContent().then(function(content){
          var items = content.items.map(function(it){
            return { str: it.str, x: it.transform[4], y: it.transform[5] };
          });
          var lines = [];
          var current = '', lastY = null;
          items.forEach(function(it){
            if(it.str === '' ) return;
            if(lastY === null || Math.abs(it.y - lastY) > 3){
              if(current.trim()) lines.push(current.trim());
              current = it.str;
            } else {
              var needSpace = !(current.endsWith(' ') || it.str.startsWith(' '));
              current += (needSpace ? ' ' : '') + it.str;
            }
            lastY = it.y;
          });
          if(current.trim()) lines.push(current.trim());
          return lines;
        });
      }));
    }
    return Promise.all(pagePromises).then(function(pages){
      return [].concat.apply([], pages);
    });
  });
}

function parseLines(lines){
  var categories = [];
  var current = null;
  var headingRe = /^#(\d+)\.\s*(.+?)\s*\((\d+)\)\s*$/;
  var compRe = /^(\d+)\s+(.+)$/;
  lines.forEach(function(raw){
    var line = raw.replace(/\s+/g,' ').trim();
    if(!line) return;
    var h = line.match(headingRe);
    if(h){
      var fullName = h[2].trim();
      var idx = fullName.lastIndexOf(' - ');
      var discipline = idx > -1 ? fullName.slice(0, idx).trim() : fullName;
      var className = idx > -1 ? fullName.slice(idx + 3).trim() : '';
      current = { discipline: discipline, className: className, expected: parseInt(h[3],10), athletes: [] };
      categories.push(current);
      return;
    }
    if(!current) return;
    if(/^Comp\s*#\s*Name/i.test(line)) return;
    if(/^Page\s+\d+\s+of\s+\d+/i.test(line)) return;
    var a = line.match(compRe);
    if(a){
      var name = a[2].trim();
      var dashIdx = name.indexOf(' - (');
      if(dashIdx > -1) name = name.slice(0, dashIdx).trim();
      if(name) current.athletes.push({ comp: a[1], name: name });
    }
  });
  return categories;
}

function buildRowsFromCategories(categories){
  var seen = {};
  categories.forEach(function(cat){
    cat.athletes.forEach(function(ath){
      ath.routine = !seen[ath.comp];
      seen[ath.comp] = true;
    });
  });

  var rows = [];
  var lastDiscipline = null;
  categories.forEach(function(cat, i){
    if(lastDiscipline !== null && cat.discipline !== lastDiscipline){
      rows.push(makeOverallRow(lastDiscipline));
    }
    rows.push({
      id: nextId(),
      type: 'category',
      discipline: cat.discipline,
      className: cat.className,
      isExtra: isExtraCategory(cat.discipline, cat.className),
      athletes: cat.athletes,
      formulaType: defaultFormula(cat.discipline),
      actualEnd: null,
      notes: '',
      expanded: false
    });
    lastDiscipline = cat.discipline;
  });
  if(lastDiscipline !== null){
    rows.push(makeOverallRow(lastDiscipline));
  }
  return rows;
}
function makeDelayRow(discipline){
  return {
    id: nextId(),
    type: 'delay',
    discipline: discipline,
    className: 'Delay',
    delayMinutes: 10,
    delayNote: '',
    actualEnd: null
  };
}
function makeOverallRow(discipline){
  return {
    id: nextId(),
    type: 'overall',
    discipline: discipline,
    className: 'Overall / Posedown',
    overallMinutes: 5,
    actualEnd: null,
    notes: '',
    included: true
  };
}

/* This page runs in a sandboxed frame where browser modals (confirm/prompt/alert)
   are silently blocked. So destructive actions use a two-click "click again to
   confirm" pattern instead — the button re-labels itself and reverts after 4s. */
function armConfirm(btn, confirmLabel, onConfirm){
  var original = btn.textContent;
  var armed = false, timer = null;
  btn.addEventListener('click', function(){
    if(armed){
      clearTimeout(timer);
      armed = false;
      btn.textContent = original;
      onConfirm();
      return;
    }
    armed = true;
    btn.textContent = confirmLabel;
    btn.classList.add('armed');
    timer = setTimeout(function(){
      armed = false;
      btn.textContent = original;
      btn.classList.remove('armed');
    }, 4000);
  });
}

function el(tag, attrs, children){
  var e = document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}
function txt(t){ return document.createTextNode(t); }

function buildUploadZone(){
  var zone = el('div',{class:'upload-zone',id:'upload-zone'});
  var icon = el('div',{class:'icon',html:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>'});
  zone.appendChild(icon);
  var copy = el('div',{class:'copy'});
  var strong = el('strong'); strong.appendChild(txt(state.rows.length ? 'Re-parse a different expeditor sheet' : 'Drop the Expeditor Sheet PDF here'));
  var span = el('span'); span.appendChild(txt('or click to browse — parsed straight in your browser, nothing is uploaded anywhere'));
  copy.appendChild(strong); copy.appendChild(span);
  zone.appendChild(copy);
  var btn = el('button',{class:'btn primary'}); btn.appendChild(txt('Choose PDF'));
  zone.appendChild(btn);
  var input = el('input',{type:'file',accept:'application/pdf'});
  zone.appendChild(input);

  function handleFile(file){
    if(!file) return;
    var statusEl = document.getElementById('parse-status');
    statusEl.className = 'parse-status'; statusEl.textContent = 'Reading ' + file.name + '…';
    file.arrayBuffer().then(function(buf){
      return pdfjsLib.getDocument({data: buf}).promise;
    }).then(function(pdf){
      return extractLines(pdf);
    }).then(function(lines){
      var categories = parseLines(lines);
      if(!categories.length){
        throw new Error('No categories found — this doesn\'t look like a Muscleware Expeditor Sheet, or the text layer couldn\'t be read.');
      }
      state.rows = buildRowsFromCategories(categories);
      state.fileName = file.name;
      var totalAthleteLines = categories.reduce(function(s,c){ return s + c.athletes.length; }, 0);
      statusEl.textContent = 'Parsed ' + categories.length + ' categories, ' + totalAthleteLines + ' athlete lines.';
      scheduleSave();
      render();
    }).catch(function(err){
      statusEl.className = 'parse-status err';
      statusEl.textContent = 'Could not parse this PDF: ' + err.message;
    });
  }
  btn.addEventListener('click', function(){ input.click(); });
  input.addEventListener('change', function(){ handleFile(input.files[0]); });
  zone.addEventListener('dragover', function(e){ e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', function(){ zone.classList.remove('drag'); });
  zone.addEventListener('drop', function(e){
    e.preventDefault(); zone.classList.remove('drag');
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  return zone;
}

function buildTabBar(){
  var counts = { all: 0, mens: 0, womens: 0 };
  state.rows.forEach(function(r){
    if(r.type !== 'category') return;
    counts.all++;
    counts[genderOf(r.discipline)]++;
  });

  var bar = el('div',{class:'tab-bar'});
  [['all','Full show',counts.all],['mens',"Men's",counts.mens],['womens',"Women's",counts.womens]].forEach(function(t){
    if(t[0] !== 'all' && t[2] === 0) return; // hide an empty side
    var b = el('button',{class:'tab' + (activeTab === t[0] ? ' active' : '')});
    b.appendChild(txt(t[1]));
    var c = el('span',{class:'tab-count'}); c.appendChild(txt(String(t[2])));
    b.appendChild(c);
    b.addEventListener('click', function(){ activeTab = t[0]; render(); });
    bar.appendChild(b);
  });

  if(activeTab !== 'all'){
    var hint = el('span',{class:'tab-hint'});
    hint.appendChild(txt('Times are still calculated across the whole show — you are just filtering the view.'));
    bar.appendChild(hint);
  }
  return bar;
}

function buildTable(){
  var table = el('table',{class:'sheet'});
  var thead = el('thead');
  var htr = el('tr');
  ['Class','Competitors','Routines','Duration','Start','End','Notify',''].forEach(function(h){
    var th = el('th'); th.appendChild(txt(h)); htr.appendChild(th);
  });
  thead.appendChild(htr);
  table.appendChild(thead);
  var tbody = el('tbody');

  var lastDiscipline = null;
  state.rows.forEach(function(row, i){
    // Tabs filter what is shown. The schedule itself is always calculated
    // across every row, because it is one continuous stage running order.
    if(activeTab !== 'all' && genderOf(row.discipline) !== activeTab) return;
    if(row.discipline !== lastDiscipline){
      tbody.appendChild(buildGroupHeaderRow(row.discipline));
      lastDiscipline = row.discipline;
    }
    if(row.type === 'category') tbody.appendChild(buildCategoryRow(row, i));
    else if(row.type === 'overall') tbody.appendChild(buildOverallRow(row, i));
    else if(row.type === 'delay') tbody.appendChild(buildDelayRow(row, i));
    else tbody.appendChild(buildCustomRow(row, i));

    if(row.type === 'category' && row.expanded){
      tbody.appendChild(buildAthletePanel(row, i));
    }
  });
  table.appendChild(tbody);
  return table;
}

  var tr = el('tr',{class:'group-row'});

  var wrap = el('div',{class:'glabel'});
  wrap.appendChild(el('div',{class:'bar',style:'background:' + colorFor(discipline)}));
  var input = el('input',{class:'cell-edit',style:'font-weight:700;font-size:13px;max-width:280px;'});
  input.value = discipline;
  input.addEventListener('change', function(){

    state.rows.forEach(function(r){ if(r.discipline === discipline) r.discipline = newVal; });
    scheduleSave(); render();
  });
  wrap.appendChild(input);
  var c = el('span',{class:'gcount'}); c.appendChild(txt(count + ' class' + (count===1?'':'es')));

}

function rowById(id){ return state.rows.find(function(r){ return r.id === id; }); }
function moveRow(id, dir){
  var idx = state.rows.findIndex(function(r){ return r.id === id; });
  var newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= state.rows.length) return;
  var tmp = state.rows[idx];
  state.rows[idx] = state.rows[newIdx];
  state.rows[newIdx] = tmp;
  scheduleSave(); render();
}
function deleteRow(id){
  state.rows = state.rows.filter(function(r){ return r.id !== id; });
  scheduleSave(); render();
}

function rowActions(row, i){
  var wrap = el('div',{class:'row-actions'});
  var addDelay = el('button',{class:'icon-btn delay-add',title:'Insert a delay straight after this row'});
  addDelay.appendChild(txt('⏸'));
  addDelay.addEventListener('click', function(){
    var idx = state.rows.findIndex(function(r){ return r.id === row.id; });
    state.rows.splice(idx + 1, 0, makeDelayRow(row.discipline));
    scheduleSave(); render();
  });
  var up = el('button',{class:'icon-btn',title:'Move up'}); up.appendChild(txt('▲'));
  up.addEventListener('click', function(){ moveRow(row.id, -1); });
  var down = el('button',{class:'icon-btn',title:'Move down'}); down.appendChild(txt('▼'));
  down.addEventListener('click', function(){ moveRow(row.id, 1); });
  var del = el('button',{class:'icon-btn del',title:'Delete row — click twice to confirm'}); del.appendChild(txt('✕'));
  armConfirm(del, '✓?', function(){ deleteRow(row.id); });
  wrap.appendChild(addDelay); wrap.appendChild(up); wrap.appendChild(down); wrap.appendChild(del);
  return wrap;
}

function parseTimeInput(str){
  if(!str) return null;
  str = str.trim().toLowerCase().replace(/\s+/g,' ');
  var m = str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
  if(!m) return null;
  var h = parseInt(m[1],10), min = m[2] ? parseInt(m[2],10) : 0, ampm = m[3];
  if(isNaN(h) || min > 59) return null;
  if(ampm){
    if(h < 1 || h > 12) return null;
    if(h === 12) h = 0;
    if(ampm === 'pm') h += 12;
  } else if(h > 23){
    return null;
  }
  return String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
}

function endCell(row){
  var td = el('td');
  var overridden = !!row.actualEnd;
  var input = el('input',{
    class:'actual-input' + (overridden ? ' overridden' : ''),
    type:'text',
    inputmode:'numeric',
    placeholder:'h:mm am/pm',
    title: overridden ? 'Manually set — everything after this row re-times off it. Press Enter to confirm a change.' : 'Auto-calculated. Type a real finish time and press Enter to lock it in.'
  });
  input.value = overridden ? formatClock(timeStrToDate(row.actualEnd)) : formatClock(row.estEndD);
  function commit(){
    var raw = input.value.trim();
    if(raw === '' || raw === formatClock(row.estEndD)){
      if(row.actualEnd !== null){ row.actualEnd = null; scheduleSave(); render(); }
      return;
    }
    var parsed = parseTimeInput(raw);
    if(!parsed){
      input.classList.add('input-error');
      return;
    }
    input.classList.remove('input-error');
    if(parsed !== row.actualEnd){ row.actualEnd = parsed; scheduleSave(); render(); }
  }
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); commit(); input.blur(); }
    else if(e.key === 'Escape'){ input.value = overridden ? formatClock(timeStrToDate(row.actualEnd)) : formatClock(row.estEndD); input.blur(); }
  });
  input.addEventListener('blur', commit);
  td.appendChild(input);
  if(overridden){
    var clr = el('button',{class:'clear-x',title:'Revert to auto-calculated time'}); clr.appendChild(txt('×'));
    clr.addEventListener('click', function(){ row.actualEnd = null; scheduleSave(); render(); });
    td.appendChild(clr);
  }
  return td;
}

function appendDurationContent(tdDur, row){
  tdDur.appendChild(txt(formatDuration(row.minutes) + ' min'));
  if(row._calSource){
    var badge = el('span',{class:'cal-badge',title:'Adjusted from ' + row._calSource.n + ' logged show' + (row._calSource.n===1?'':'s') + ' (' + row._calSource.label + '). Formula alone said ' + formatDuration(row._rawMinutes) + ' min.'});
    badge.appendChild(txt('◆'));
    tdDur.appendChild(badge);
  }
}

  tdClass.appendChild(chevron);
  var nameInput = el('input',{class:'cell-edit classname',type:'text',style:'display:inline-block;width:auto;min-width:140px;'});

  tdClass.appendChild(nameInput);

    var scratchNote = el('span',{class:'scratch-note'}); scratchNote.appendChild(txt('(-' + row.scratchedCount + ')'));

  tdComp.addEventListener('click', function(){ row.expanded = true; render(); });

  tr.appendChild(endCell(row));

  return tr;
}

function buildHistoryPanel(){
  var panel = el('div',{class:'panel history-panel'});
  var head = el('div',{class:'history-head'});
  var title = el('div',{class:'history-title'}); title.appendChild(txt('Learned timing history'));
  head.appendChild(title);
  var clearBtn = el('button',{class:'btn small danger',title:'Forget everything learned from past Actual End times. Click twice to confirm.'});
  clearBtn.appendChild(txt('Clear history'));
  clearBtn.disabled = calibration.records.length === 0;
  armConfirm(clearBtn, 'Click again to clear', function(){
    clearCalibration(); render();
  });
  head.appendChild(clearBtn);
  panel.appendChild(head);

  if(!calibration.records.length){
    var empty = el('div',{class:'history-empty'});
    empty.appendChild(txt('Nothing learned yet. Enter Actual End times on the schedule below, then click "Learn from actuals" — the more shows you run through this, the more accurate the Duration column gets for the classes you always run.'));
    panel.appendChild(empty);
    return panel;
  }

  var groups = {};
  calibration.records.forEach(function(r){
    if(!groups[r.key]) groups[r.key] = { discipline: r.discipline, className: r.className, formulaType: r.formulaType, recs: [] };
    groups[r.key].recs.push(r);
  });
  var keys = Object.keys(groups).sort(function(a,b){ return groups[b].recs.length - groups[a].recs.length; });

  var table = el('table',{class:'history-table'});
  var thead = el('tr');
  ['Class','Shows learned from','Formula estimate','Actual (avg)','Adjustment'].forEach(function(h){
    var th = el('th'); th.appendChild(txt(h)); thead.appendChild(th);
  });
  table.appendChild(thead);
  keys.forEach(function(k){
    var g = groups[k];
    var ratio = ratioFromRecords(g.recs);
    var avgEst = g.recs.reduce(function(s,r){ return s + r.estMinutes; },0) / g.recs.length;
    var avgAct = g.recs.reduce(function(s,r){ return s + r.actualMinutes; },0) / g.recs.length;
    var tr = el('tr');
    var tdClass = el('td');
    tdClass.appendChild(txt((g.discipline||'') + ' — ' + (g.className||'')));
    tr.appendChild(tdClass);
    var tdN = el('td',{class:'mono num-cell'}); tdN.appendChild(txt(String(g.recs.length)));
    tr.appendChild(tdN);
    var tdEst = el('td',{class:'mono num-cell'}); tdEst.appendChild(txt(avgEst.toFixed(1) + ' min'));
    tr.appendChild(tdEst);
    var tdAct = el('td',{class:'mono num-cell'}); tdAct.appendChild(txt(avgAct.toFixed(1) + ' min'));
    tr.appendChild(tdAct);
    var tdAdj = el('td',{class:'mono num-cell'});
    var pct = Math.round((ratio - 1) * 100);
    var pctSpan = el('span',{style:'color:' + (pct > 0 ? 'var(--burg)' : pct < 0 ? 'var(--call)' : 'var(--muted)')});
    pctSpan.appendChild(txt((pct > 0 ? '+' : '') + pct + '%'));
    tdAdj.appendChild(pctSpan);
    tr.appendChild(tdAdj);
    table.appendChild(tr);
  });
  panel.appendChild(table);
  var note = el('div',{class:'history-note'});
  note.appendChild(txt('A class needs at least 2 logged shows before its own history is used; until then it borrows the average adjustment for all physique-style or all comparison-style classes (needs 3+ shows).'));
  panel.appendChild(note);
  return panel;
}

function buildTransferPanel(){
  var panel = el('div',{class:'panel history-panel'});
  var head = el('div',{class:'history-head'});
  var title = el('div',{class:'history-title'}); title.appendChild(txt('Share / back up learned history'));
  head.appendChild(title);
  var closeBtn = el('button',{class:'btn small ghost'}); closeBtn.appendChild(txt('Close'));
  closeBtn.addEventListener('click', function(){ transferPanelOpen = false; render(); });
  head.appendChild(closeBtn);
  panel.appendChild(head);

  var intro = el('div',{class:'history-empty',style:'margin-bottom:12px;'});
  intro.appendChild(txt('Copy the text below and send it to another coach — they paste it into this same box on their own copy and click Import. Also worth keeping as a backup: paste it somewhere safe and you can always restore your learning, even on a fresh page.'));
  panel.appendChild(intro);

  var ta = el('textarea',{class:'transfer-box',spellcheck:'false'});
  ta.value = JSON.stringify({ v:1, records: calibration.records });
  panel.appendChild(ta);

  var btnRow = el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;'});

  var copyBtn = el('button',{class:'btn small'}); copyBtn.appendChild(txt('Select all (then copy)'));
  copyBtn.addEventListener('click', function(){ ta.focus(); ta.select(); });
  btnRow.appendChild(copyBtn);

  var mergeBtn = el('button',{class:'btn small add'}); mergeBtn.appendChild(txt('Import & merge'));
  mergeBtn.addEventListener('click', function(){ doImport(ta, 'merge'); });
  btnRow.appendChild(mergeBtn);

  var replaceBtn = el('button',{class:'btn small danger'}); replaceBtn.appendChild(txt('Import & replace'));
  armConfirm(replaceBtn, 'Click again to replace', function(){ doImport(ta, 'replace'); });
  btnRow.appendChild(replaceBtn);

  var msg = el('span',{class:'transfer-msg',id:'transfer-msg'});
  btnRow.appendChild(msg);

  panel.appendChild(btnRow);

  var note = el('div',{class:'history-note'});
  note.appendChild(txt('Merge adds the incoming records to yours and skips exact duplicates — safe to run twice. Replace throws your current history away and uses only what is in the box.'));
  panel.appendChild(note);

  if(TEAM_SYNC_URL){
    var sync = el('div',{class:'sync-block'});
    var syncTitle = el('div',{class:'history-title',style:'font-size:11.5px;margin-bottom:6px;'});
    syncTitle.appendChild(txt('Shared pool'));
    sync.appendChild(syncTitle);

    var status = el('div',{class:'history-note',style:'margin-top:0;margin-bottom:8px;'});
    status.appendChild(txt(isContributor()
      ? 'This browser CONTRIBUTES — your logged shows are added to the shared pool for everyone.'
      : 'This browser is READ-ONLY — it receives everyone else\'s learning but never changes the pool. Add the contributor key below if this is the head coach\'s device.'));
    sync.appendChild(status);

    var keyRow = el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;'});
    var keyInput = el('input',{class:'meta-field-input key-input',type:'password',placeholder:'contributor key'});
    keyInput.value = contributorKey();
    keyRow.appendChild(keyInput);
    var saveKey = el('button',{class:'btn small'}); saveKey.appendChild(txt('Save key'));
    saveKey.addEventListener('click', function(){
      LS.set('contributor_key', keyInput.value.trim());
      render();
    });
    keyRow.appendChild(saveKey);
    if(isContributor()){
      var clearKey = el('button',{class:'btn small ghost'}); clearKey.appendChild(txt('Remove key'));
      clearKey.addEventListener('click', function(){ LS.set('contributor_key',''); render(); });
      keyRow.appendChild(clearKey);
    }
    var pullBtn = el('button',{class:'btn small add'}); pullBtn.appendChild(txt('Pull latest now'));
    pullBtn.addEventListener('click', function(){
      var before = calibration.records.length;
      pullFromTeam().then(function(){
        var added = calibration.records.length - before;
        var m = document.getElementById('transfer-msg');
        if(m){ m.textContent = 'Pulled — added ' + added + ' new record' + (added===1?'':'s') + '.'; m.style.color='var(--call)'; }
        setTimeout(render, 900);
      });
    });
    keyRow.appendChild(pullBtn);
    sync.appendChild(keyRow);
    panel.appendChild(sync);
  }

  return panel;
}

function doImport(ta, mode){
  var msg = document.getElementById('transfer-msg');
  function say(text, ok){
    if(!msg) return;
    msg.textContent = text;
    msg.style.color = ok ? 'var(--call)' : 'var(--burg)';
  }
  var parsed;
  try{ parsed = JSON.parse(ta.value); }
  catch(e){ say('That does not look like valid history text.', false); return; }
  var incoming = parsed && parsed.records;
  if(!incoming || !incoming.length){ say('No records found in that text.', false); return; }

  if(mode === 'replace'){
    calibration.records = incoming.slice();
    scheduleCalSave();
    say('Replaced — now holding ' + calibration.records.length + ' records.', true);
    setTimeout(render, 900);
    return;
  }

  var seen = {};
  calibration.records.forEach(function(r){ seen[r.key + '|' + r.ts + '|' + r.actualMinutes] = true; });
  var added = 0;
  incoming.forEach(function(r){
    var sig = r.key + '|' + r.ts + '|' + r.actualMinutes;
    if(seen[sig]) return;
    seen[sig] = true;
    calibration.records.push(r);
    added++;
  });
  if(added > 0) scheduleCalSave();
  say('Merged — added ' + added + ' new record' + (added===1?'':'s') + ', now ' + calibration.records.length + ' total.', true);
  setTimeout(render, 900);
}

function buildAddRowStrip(){
  var strip = el('div',{class:'add-row-strip'});
  var addCustom = el('button',{class:'btn small add'}); addCustom.appendChild(txt('+ Add manual row'));
  addCustom.addEventListener('click', function(){
    var lastDiscipline = state.rows.length ? state.rows[state.rows.length-1].discipline : 'New Category';
    state.rows.push({
      id: nextId(), type: 'custom', discipline: lastDiscipline, className: 'New class',
      competitors: 0, routines: 0, formulaType: 'physique', manualMinutes: 0,
      actualEnd: null, notes: ''
    });
    scheduleSave(); render();
  });
  var addOverall = el('button',{class:'btn small add'}); addOverall.appendChild(txt('+ Add overall/posedown row'));
  addOverall.addEventListener('click', function(){
    var lastDiscipline = state.rows.length ? state.rows[state.rows.length-1].discipline : 'New Category';
    state.rows.push(makeOverallRow(lastDiscipline));
    scheduleSave(); render();
  });
  var addDelayBtn = el('button',{class:'btn small add'}); addDelayBtn.appendChild(txt('+ Add delay'));
  addDelayBtn.addEventListener('click', function(){
    var lastDiscipline = state.rows.length ? state.rows[state.rows.length-1].discipline : 'New Category';
    state.rows.push(makeDelayRow(lastDiscipline));
    scheduleSave(); render();
  });
  strip.appendChild(addCustom);
  strip.appendChild(addOverall);
  strip.appendChild(addDelayBtn);
  return strip;
}

/* ---------- init ---------- */
loadCalibration().then(loadSaved);

})();
</script>
